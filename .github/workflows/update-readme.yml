name: Update README Stats
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'template.md'
      - 'scripts/**'
      - 'profile.jpg'
jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build README
        run: |
          npm run generate-avatar || true
          node scripts/fetch-repos.js
          node scripts/build.js
      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate README.md"
          branch: main
          file_pattern: README.md matrix-avatar.svg
